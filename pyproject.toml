[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "project-copilot-plusng"
dynamic = ["version"]
description = "Project Copilot Starter Kit – Plus NG"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "streamlit>=1.32.0",
    "PyYAML>=6.0.1",
    "pypdf>=4.0.0",

    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26",
    "faiss-cpu>=1.7.4",
    "google-genai>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "db*"]

[tool.setuptools.package-data]
db = ["migrations/*.sql"]
app = ["*.yaml", "*.json"]



[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"



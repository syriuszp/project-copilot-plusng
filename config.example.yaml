env: prod

features:
  # Feature Flags
  search_enabled: true
  fts_enabled: true
  
  extraction:
    docx: true
    pdf: true
    
    # Images & OCR
    images: true
    ocr: true  # Can be bool or dict
    # ocr:
    #   enabled: true
    #   tesseract_path: "C:/Path/To/Tesseract.exe"

paths:
  # Absolute paths recommended for PROD
  db_path: "C:/Path/To/prod/db/project_copilot.db"
  ingest_dir: "C:/Path/To/prod/data/ingest"
  processed_dir: "C:/Path/To/prod/data/processed"
  logs_dir: "C:/Path/To/prod/logs"
  tools_dir: "C:/Path/To/prod/tools"

# Logging Configuration (Optional)
# log_level: INFO

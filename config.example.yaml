env: prod

features:
  # Feature Flags
  search_enabled: true
  fts_enabled: true
  
  extraction:
    docx: true
    pdf: true
    
    # Images & OCR
    images: true
    ocr: true  # Can be bool or dict
    # ocr:
    #   enabled: true
    #   tesseract_path: "C:/Path/To/Tesseract.exe"

paths:
  # Absolute paths recommended for PROD
  # Ensure these point to existing, writable directories
  db_path: "project_copilot.db" 
  ingest_dir: "data/ingest"
  processed_dir: "data/processed"
  logs_dir: "logs"
  tools_dir: "tools"

# Logging Configuration (Optional)
# log_level: INFO
